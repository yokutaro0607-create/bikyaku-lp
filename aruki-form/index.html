<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>歩き方診断 提出フォーム</title>
<style>
  :root {
    --accent: #e05a7a;
    --accent-dark: #c94868;
    --blue: #3598db;
    --red: #e03e2d;
    --bg: #fdf6f7;
    --card: #ffffff;
    --text: #333333;
    --border: #e8d5da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 60px;
    background: var(--bg); color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    font-size: 17px; line-height: 1.7;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 {
    color: var(--blue); font-size: 24px; line-height: 1.4;
    margin: 18px 0 10px; text-align: center;
  }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 16px; margin-bottom: 16px;
  }
  .notice strong { color: var(--red); }
  .notice a {
    display: inline-block; margin: 8px 0; padding: 10px 18px;
    background: var(--blue); color: #fff; text-decoration: none;
    border-radius: 8px; font-weight: bold;
  }
  label.q {
    display: block; font-weight: bold; margin: 4px 0 8px;
    white-space: pre-line;
  }
  .req {
    display: inline-block; background: var(--red); color: #fff;
    font-size: 14px; border-radius: 4px; padding: 0 6px; margin-left: 6px;
    vertical-align: middle;
  }
  input[type="text"], input[type="email"], textarea {
    width: 100%; font-size: 17px; padding: 10px;
    border: 1px solid #ccc; border-radius: 8px; background: #fff;
  }
  textarea { min-height: 110px; resize: vertical; }
  .filebox { margin-top: 6px; }
  .filebox input[type="file"] { font-size: 15px; max-width: 100%; }
  .hint { font-size: 14px; color: #777; margin-top: 4px; }
  .progress-outer {
    height: 14px; background: #f0e2e6; border-radius: 7px;
    overflow: hidden; margin-top: 8px; display: none;
  }
  .progress-inner {
    height: 100%; width: 0%; background: var(--accent);
    transition: width .2s;
  }
  .progress-label { font-size: 14px; color: #777; margin-top: 2px; }
  #submitBtn {
    display: block; width: 100%; padding: 16px; margin-top: 8px;
    font-size: 19px; font-weight: bold; color: #fff;
    background: var(--accent); border: none; border-radius: 12px;
    cursor: pointer;
  }
  #submitBtn:disabled { background: #d9a8b5; cursor: default; }
  #status {
    margin-top: 12px; font-size: 16px; text-align: center;
    white-space: pre-line;
  }
  #status.error { color: var(--red); font-weight: bold; }
  #doneCard { display: none; text-align: center; }
  #doneCard h2 { color: var(--accent-dark); }
  .err-field { border-color: var(--red) !important; background: #fff3f2 !important; }
</style>
</head>
<body>
<div class="wrap">

  <h1 id="formTitle">歩き方診断申込フォーム</h1>

  <div class="card notice">
    <p><strong>＜ご注意点＞</strong><br>
    正しい診断を行うため、撮影方法に則り撮影された動画やお写真をお送りいただいた方のみ診断させていただきます。<br>
    <strong>必ず以下の撮影方法をご覧の上、ご提出ください。</strong></p>
    <p style="text-align:center"><a id="guideLink" href="#" target="_blank" rel="noopener">▶ 撮影方法を見る ◀</a></p>
    <p>・回答締め切り <strong id="deadlineText"></strong><br>
    ・診断結果は <strong id="resultText"></strong> にお送りします。</p>
    <p><strong style="color:var(--red)">＜動画がうまく送れない場合＞</strong><br>
    <span id="troubleText"></span></p>
  </div>

  <form id="mainForm" onsubmit="return false;">

    <div class="card">
      <label class="q" for="f_name">お名前を入力してください<span class="req">必須</span></label>
      <input type="text" id="f_name" autocomplete="name">
    </div>

    <div class="card">
      <label class="q" for="f_email">メールアドレスを入力してください<span class="req">必須</span></label>
      <input type="email" id="f_email" autocomplete="email" inputmode="email">
    </div>

    <div class="card">
      <label class="q">カメラ位置【横】<span class="req">必須</span>
・横からのカメラに対して5歩程度歩き、3往復する</label>
      <div class="filebox">
        <input type="file" id="f_side" accept="video/*">
        <div class="hint">スマホで撮影した動画をそのまま選択できます</div>
        <div class="progress-outer" id="p_side"><div class="progress-inner"></div></div>
        <div class="progress-label" id="pl_side"></div>
      </div>
    </div>

    <div class="card">
      <label class="q">カメラ位置【正面】<span class="req">必須</span>
・カメラに向かって歩く→振り返りカメラを背にして歩く
・5歩程度を3往復する</label>
      <div class="filebox">
        <input type="file" id="f_front" accept="video/*">
        <div class="progress-outer" id="p_front"><div class="progress-inner"></div></div>
        <div class="progress-label" id="pl_front"></div>
      </div>
    </div>

    <div class="card">
      <label class="q">靴の裏の写真を添付ください<span class="req">必須</span>
※撮影方法の詳細は「撮影方法を見る」からご確認ください</label>
      <div class="filebox">
        <input type="file" id="f_shoe" accept="image/*">
        <div class="progress-outer" id="p_shoe"><div class="progress-inner"></div></div>
        <div class="progress-label" id="pl_shoe"></div>
      </div>
    </div>

    <div class="card">
      <label class="q" for="f_q1">①お悩み（不調面）をご記入ください<span class="req">必須</span></label>
      <textarea id="f_q1"></textarea>
    </div>

    <div class="card">
      <label class="q" for="f_q2">②お悩み（見た目面）をご記入ください<span class="req">必須</span></label>
      <textarea id="f_q2"></textarea>
    </div>

    <div class="card">
      <label class="q" for="f_q3">③お悩み（歩き方）をご記入ください<span class="req">必須</span></label>
      <textarea id="f_q3"></textarea>
    </div>

    <div class="card">
      <label class="q" for="f_q4">④「どんな風に変わりたいか」をご記入ください<span class="req">必須</span></label>
      <textarea id="f_q4"></textarea>
    </div>

    <button id="submitBtn">提出する</button>
    <div id="status"></div>
  </form>

  <div class="card" id="doneCard">
    <h2>ご提出ありがとうございました！</h2>
    <p>動画・写真・ご回答を受け付けました。<br>
    診断結果は <strong id="resultText2"></strong> にお送りしますので、楽しみにお待ちください。</p>
  </div>

</div>

<script>
// ================= 設定（ここだけ書き換える） =================

var CONFIG = {
  // GASウェブアプリのURL（デプロイ後に貼り替える。末尾が /exec のもの）
  GAS_URL: 'https://script.google.com/macros/s/AKfycby4zSNjhPzc98_tjLLUjxAt04VjeF3IlxFMi3KjT8eyrSrAc7jm0U_MmYm64BlgFU_NQg/exec',

  // GAS側 Code.gs の FORM_KEY と同じ文字列
  FORM_KEY: 'aruki-2026',

  // 撮影方法ページのURL（自前版。同じフォルダに置いた 撮影方法.html を開く）
  GUIDE_URL: '撮影方法.html',

  // ▼ 開催回ごとに書き換える文言（日付をコードに埋め込まないための設定）
  DEADLINE_TEXT: '【○月○日23:59迄】',
  RESULT_TEXT: '【○月中】にLINE',
  TROUBLE_TEXT: '容量オーバーや、ファイル形式が異なる等で、動画がうまく送れない場合は、【必ず】公式LINEに動画が送れなかった旨ご連絡いただき、フォームからではなく、LINEに直接動画をお送りください。'
};

// ==============================================================

var CHUNK = 8 * 1024 * 1024; // 8MB（256KBの倍数であること）

document.getElementById('guideLink').href = CONFIG.GUIDE_URL;
document.getElementById('deadlineText').textContent = CONFIG.DEADLINE_TEXT;
document.getElementById('resultText').textContent = CONFIG.RESULT_TEXT;
document.getElementById('resultText2').textContent = CONFIG.RESULT_TEXT;
document.getElementById('troubleText').textContent = CONFIG.TROUBLE_TEXT;

function $(id) { return document.getElementById(id); }

function setStatus(msg, isError) {
  var el = $('status');
  el.textContent = msg;
  el.className = isError ? 'error' : '';
}

// 送信の途中経過をこの端末に控える（やり直しても最初からにならないようにする）
//   なぜ要るか（2026-08-30）: GASへの問い合わせは script.google.com で処理を終えてから
//   googleusercontent.com へ寄り道して返事を受け取る2段構え。携帯回線などで2段目だけ
//   取りこぼすと、サーバー側は成功しているのに画面には「通信エラー」と出て止まる。
//   実際に「フォルダだけできて中身が空」「1本目だけで止まる」提出が何件も残り、
//   3〜5回やり直した方がいた。控えを持つことで、やり直しは続きから再開になる。
var RESUME_TTL = 6 * 60 * 60 * 1000;   // 6時間で控えを捨てる
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function resumeKey(name, email) { return 'resume:' + CONFIG.FORM_KEY + ':' + name + '|' + email; }
function loadResume(key) {
  try {
    var s = JSON.parse(localStorage.getItem(key) || 'null');
    if (s && s.at && Date.now() - s.at < RESUME_TTL) { s.key = key; return s; }
  } catch (e) {}
  return null;
}
function saveResume(s) {
  try { s.at = Date.now(); localStorage.setItem(s.key, JSON.stringify(s)); } catch (e) {}
}
function clearResume(key) { try { localStorage.removeItem(key); } catch (e) {} }

// GASのAPI呼び出し（text/plainで送るとプリフライト無しで届く）
// 返事を1回取りこぼしただけで提出全体が失敗しないよう、間を空けて3回まで試す。
async function api(payload) {
  payload.key = CONFIG.FORM_KEY;
  var last;
  for (var i = 0; i < 3; i++) {
    if (i) await sleep(1500 * i);
    try {
      var r = await fetch(CONFIG.GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
      var j = await r.json();
      if (!j.ok) throw new Error(j.error || 'サーバーエラー');
      return j;
    } catch (e) { last = e; }
  }
  throw last;
}

// 1チャンクをアップロード（308=続きあり、200/201=完了）
function putChunk(uploadUrl, blob, start, total, onProgress) {
  return new Promise(function (resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open('PUT', uploadUrl, true);
    var end = start + blob.size - 1;
    xhr.setRequestHeader('Content-Range', 'bytes ' + start + '-' + end + '/' + total);
    xhr.upload.onprogress = function (ev) {
      if (ev.lengthComputable) onProgress(start + ev.loaded);
    };
    xhr.onload = function () {
      if (xhr.status === 308 || xhr.status === 200 || xhr.status === 201) resolve(xhr.status);
      else reject(new Error('アップロード失敗 (HTTP ' + xhr.status + ')'));
    };
    xhr.onerror = function () { reject(new Error('通信エラー')); };
    xhr.send(blob);
  });
}

// Driveに「いまどこまで届いたか」を聞く。-1 が返ったら、そのファイルは完了している。
function askOffset(uploadUrl, total) {
  return new Promise(function (resolve) {
    var xhr = new XMLHttpRequest();
    xhr.open('PUT', uploadUrl, true);
    xhr.setRequestHeader('Content-Range', 'bytes */' + total);
    xhr.onload = function () {
      if (xhr.status === 200 || xhr.status === 201) return resolve(-1);
      var m = xhr.status === 308 && /bytes=0-(\d+)/.exec(xhr.getResponseHeader('Range') || '');
      resolve(m ? Number(m[1]) + 1 : 0);
    };
    xhr.onerror = function () { resolve(0); };
    xhr.send();
  });
}

// ファイル1つを分割アップロード。途中で切れても、次は続きから送る。
async function uploadFile(state, slot, file, saveName, barId, labelId) {
  var bar = $(barId); bar.style.display = 'block';
  var inner = bar.querySelector('.progress-inner');
  var label = $(labelId);

  function show(sent) {
    var pct = Math.min(100, Math.round(sent / file.size * 100));
    inner.style.width = pct + '%';
    label.textContent = 'アップロード中… ' + pct + '%';
  }
  function finish(msg) { inner.style.width = '100%'; label.textContent = msg; }

  var slots = state.slots || (state.slots = {});
  var s = slots[slot];
  if (!s || s.size !== file.size) s = slots[slot] = { size: file.size, url: null, done: false };
  if (s.done) { finish('送信済み ✓'); return; }

  var fresh = false;
  if (!s.url) {
    s.url = (await api({
      action: 'initUpload',
      folderId: state.folderId,
      fileName: saveName,
      mimeType: file.type || 'application/octet-stream'
    })).uploadUrl;
    fresh = true;
    saveResume(state);
  }

  var pos = fresh ? 0 : await askOffset(s.url, file.size);
  if (pos < 0) { s.done = true; saveResume(state); finish('アップロード完了 ✓'); return; }

  while (pos < file.size) {
    var end = Math.min(pos + CHUNK, file.size);
    var blob = file.slice(pos, end);
    var tries = 0, sent = false;
    while (!sent) {
      try {
        await putChunk(s.url, blob, pos, file.size, show);
        pos = end; sent = true;
      } catch (e) {
        tries++;
        if (tries >= 3) throw e;
        await sleep(2000 * tries);
        var got = await askOffset(s.url, file.size);   // 届いていた分は送り直さない
        if (got < 0) { pos = file.size; sent = true; }
        else if (got > pos) { pos = got; sent = true; }
      }
    }
  }
  // 送ったつもりで欠けるのを防ぐため、Drive側でも完了しているか最後に確かめる
  if ((await askOffset(s.url, file.size)) !== -1) {
    throw new Error(saveName + ' が最後まで届きませんでした');
  }
  s.done = true; saveResume(state);
  finish('アップロード完了 ✓');
}

function ext(file, fallback) {
  var m = /\.([A-Za-z0-9]+)$/.exec(file.name || '');
  return m ? m[1].toLowerCase() : fallback;
}

function collectAndValidate() {
  var fields = [
    { id: 'f_name', label: 'お名前' },
    { id: 'f_email', label: 'メールアドレス' },
    { id: 'f_side', label: '横からの動画', file: true },
    { id: 'f_front', label: '正面からの動画', file: true },
    { id: 'f_shoe', label: '靴の裏の写真', file: true },
    { id: 'f_q1', label: '①お悩み（不調面）' },
    { id: 'f_q2', label: '②お悩み（見た目面）' },
    { id: 'f_q3', label: '③お悩み（歩き方）' },
    { id: 'f_q4', label: '④変わりたい姿' }
  ];
  var missing = [];
  fields.forEach(function (f) {
    var el = $(f.id);
    var empty = f.file ? !el.files.length : !el.value.trim();
    el.classList.toggle('err-field', empty);
    if (empty) missing.push(f.label);
  });
  if (missing.length) {
    setStatus('未入力の項目があります：\n' + missing.join(' / '), true);
    return null;
  }
  var email = $('f_email').value.trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
    $('f_email').classList.add('err-field');
    setStatus('メールアドレスの形式が正しくありません', true);
    return null;
  }
  return {
    name: $('f_name').value.trim(),
    email: email,
    q1: $('f_q1').value.trim(),
    q2: $('f_q2').value.trim(),
    q3: $('f_q3').value.trim(),
    q4: $('f_q4').value.trim(),
    side: $('f_side').files[0],
    front: $('f_front').files[0],
    shoe: $('f_shoe').files[0]
  };
}

$('submitBtn').addEventListener('click', async function () {
  var d = collectAndValidate();
  if (!d) return;

  var btn = $('submitBtn');
  btn.disabled = true;
  setStatus('送信を開始しています…\n※完了するまでこの画面を閉じないでください');

  try {
    // 途中で切れて送り直したときは、前回のフォルダと続きを引き継ぐ
    var key = resumeKey(d.name, d.email);
    var state = loadResume(key);
    if (state && state.folderId) {
      setStatus('前回の続きから送ります…\n※完了するまでこの画面を閉じないでください');
    } else {
      state = { key: key, slots: {} };
      state.folderId = (await api({ action: 'start', name: d.name, email: d.email })).folderId;
      saveResume(state);
    }

    setStatus('横からの動画をアップロード中…\n※完了するまでこの画面を閉じないでください');
    await uploadFile(state, '01', d.side, '01_横動画.' + ext(d.side, 'mp4'), 'p_side', 'pl_side');

    setStatus('正面からの動画をアップロード中…\n※完了するまでこの画面を閉じないでください');
    await uploadFile(state, '02', d.front, '02_正面動画.' + ext(d.front, 'mp4'), 'p_front', 'pl_front');

    setStatus('靴の裏の写真をアップロード中…');
    await uploadFile(state, '03', d.shoe, '03_靴裏.' + ext(d.shoe, 'jpg'), 'p_shoe', 'pl_shoe');

    setStatus('回答を保存しています…');
    await api({
      action: 'finalize',
      folderId: state.folderId,
      answers: { name: d.name, email: d.email, q1: d.q1, q2: d.q2, q3: d.q3, q4: d.q4 }
    });
    clearResume(key);

    $('mainForm').style.display = 'none';
    $('doneCard').style.display = 'block';
    setStatus('');
    window.scrollTo(0, 0);
  } catch (e) {
    btn.disabled = false;
    setStatus('送信に失敗しました：' + e.message +
      '\n電波の良い場所でもう一度お試しください。\n何度も失敗する場合は公式LINEにご連絡ください。', true);
  }
});
</script>
</body>
</html>
