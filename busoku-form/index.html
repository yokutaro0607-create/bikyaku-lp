<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ブス足度診断 提出フォーム</title>
<style>
  :root {
    --accent: #2e9e6f;
    --accent-dark: #22815a;
    --blue: #5799db;
    --red: #e03e2d;
    --bg: #f2faf6;
    --card: #ffffff;
    --text: #333333;
    --border: #cfe6da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 60px;
    background: var(--bg); color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    font-size: 17px; line-height: 1.7;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
  .hero { margin: 0 -16px; }
  .hero img { display: block; width: 100%; height: auto; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 16px; margin-bottom: 16px;
  }
  .notice { text-align: center; }
  .notice .deadline { color: var(--red); font-size: 19px; font-weight: bold; }
  label.q {
    display: block; font-weight: bold; margin: 4px 0 8px;
    white-space: pre-line;
  }
  .req {
    display: inline-block; background: var(--red); color: #fff;
    font-size: 14px; border-radius: 4px; padding: 0 6px; margin-left: 6px;
    vertical-align: middle;
  }
  input[type="text"], input[type="email"] {
    width: 100%; font-size: 17px; padding: 10px;
    border: 1px solid #ccc; border-radius: 8px; background: #fff;
  }
  .filebox { margin-top: 6px; }
  .filebox input[type="file"] { font-size: 15px; max-width: 100%; }
  .hint { font-size: 14px; color: #777; margin-top: 4px; }
  .progress-outer {
    height: 14px; background: #dff0e8; border-radius: 7px;
    overflow: hidden; margin-top: 8px; display: none;
  }
  .progress-inner {
    height: 100%; width: 0%; background: var(--accent);
    transition: width .2s;
  }
  .progress-label { font-size: 14px; color: #777; margin-top: 2px; }
  #submitBtn {
    display: block; width: 100%; padding: 16px; margin-top: 8px;
    font-size: 19px; font-weight: bold; color: #fff;
    background: var(--accent); border: none; border-radius: 12px;
    cursor: pointer;
  }
  #submitBtn:disabled { background: #9cccb4; cursor: default; }
  #status {
    margin-top: 12px; font-size: 16px; text-align: center;
    white-space: pre-line;
  }
  #status.error { color: var(--red); font-weight: bold; }
  #doneCard { display: none; text-align: center; }
  #doneCard h2 { color: var(--accent-dark); }
  .err-field { border-color: var(--red) !important; background: #fff3f2 !important; }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <img src="img_診断とは.png" alt="ブス足度診断とは、6枚の写真をお送りいただくだけで、あなただけの「ブス足度」を導き出す診断です">
    <img src="img_やり方.png" alt="ブス足度診断のやり方：足の正面・側面（親指から）・側面（小指から）・足首（後ろから）・足裏・足上の合計6枚を撮影してください">
  </div>

  <div class="card notice">
    <p class="deadline" id="deadlineLine">【提出締め切り <span id="deadlineText"></span>】</p>
    <p id="resultLine">診断結果は <strong id="resultText"></strong> にお届けします。</p>
    <p id="troubleText" style="text-align:left"></p>
  </div>

  <form id="mainForm" onsubmit="return false;">

    <div class="card">
      <label class="q" for="f_name">お名前を入力してください<span class="req">必須</span></label>
      <input type="text" id="f_name" autocomplete="name">
    </div>

    <div class="card">
      <label class="q" for="f_email">メールアドレスを入力してください<span class="req">必須</span></label>
      <input type="email" id="f_email" autocomplete="email" inputmode="email">
    </div>

    <div class="card">
      <label class="q">「足の正面」のお写真をお送りください<span class="req">必須</span></label>
      <div class="filebox">
        <input type="file" id="f_p1" accept="image/*">
        <div class="hint">スマホで撮影した写真をそのまま選択できます</div>
        <div class="progress-outer" id="p_p1"><div class="progress-inner"></div></div>
        <div class="progress-label" id="pl_p1"></div>
      </div>
    </div>

    <div class="card">
      <label class="q">「足の側面（親指側から）」のお写真をお送りください<span class="req">必須</span></label>
      <div class="filebox">
        <input type="file" id="f_p2" accept="image/*">
        <div class="progress-outer" id="p_p2"><div class="progress-inner"></div></div>
        <div class="progress-label" id="pl_p2"></div>
      </div>
    </div>

    <div class="card">
      <label class="q">「足の側面（小指側から）」のお写真をお送りください<span class="req">必須</span></label>
      <div class="filebox">
        <input type="file" id="f_p3" accept="image/*">
        <div class="progress-outer" id="p_p3"><div class="progress-inner"></div></div>
        <div class="progress-label" id="pl_p3"></div>
      </div>
    </div>

    <div class="card">
      <label class="q">「足首（後ろから）」のお写真をお送りください<span class="req">必須</span>
※両足はこぶし一つ分離してください</label>
      <div class="filebox">
        <input type="file" id="f_p4" accept="image/*">
        <div class="progress-outer" id="p_p4"><div class="progress-inner"></div></div>
        <div class="progress-label" id="pl_p4"></div>
      </div>
    </div>

    <div class="card">
      <label class="q">「足裏」のお写真をお送りください<span class="req">必須</span></label>
      <div class="filebox">
        <input type="file" id="f_p5" accept="image/*">
        <div class="progress-outer" id="p_p5"><div class="progress-inner"></div></div>
        <div class="progress-label" id="pl_p5"></div>
      </div>
    </div>

    <div class="card">
      <label class="q">「足上」のお写真をお送りください<span class="req">必須</span></label>
      <div class="filebox">
        <input type="file" id="f_p6" accept="image/*">
        <div class="progress-outer" id="p_p6"><div class="progress-inner"></div></div>
        <div class="progress-label" id="pl_p6"></div>
      </div>
    </div>

    <button id="submitBtn">回答する</button>
    <div id="status"></div>
  </form>

  <div class="card" id="doneCard">
    <h2>ご提出ありがとうございました！</h2>
    <p>お写真6枚とご回答を受け付けました。<br>
    <span id="doneResultLine">診断結果は <strong id="resultText2"></strong> にお届けしますので、</span>楽しみにお待ちください。</p>
  </div>

</div>

<script>
// ================= 設定（ここだけ書き換える） =================

var CONFIG = {
  // GASウェブアプリのURL（デプロイ後に貼り替える。末尾が /exec のもの）
  GAS_URL: 'https://script.google.com/macros/s/AKfycbx_ZyaZ7w-EXFElIShWUgQFkbY_B_q0TlGqfqYdwZgo4gpfhRyWUA_bAtjQ4B094YJ29g/exec',

  // GAS側 Code.gs の FORM_KEY と同じ文字列
  FORM_KEY: 'busoku-2026',

  // ▼ 開催回ごとに書き換える文言。空文字 '' にするとその行ごと非表示になる
  //   （締切や結果時期はLINE配信側で案内する運用なら空のままでよい）
  DEADLINE_TEXT: '',
  RESULT_TEXT: '',
  TROUBLE_TEXT: 'フォームからうまく回答ができない場合は、LINEよりお問合せください。'
};

// ==============================================================

var CHUNK = 8 * 1024 * 1024; // 8MB（256KBの倍数であること）

// 文言が空ならその行ごと隠す
if (CONFIG.DEADLINE_TEXT) {
  document.getElementById('deadlineText').textContent = CONFIG.DEADLINE_TEXT;
} else {
  document.getElementById('deadlineLine').style.display = 'none';
}
if (CONFIG.RESULT_TEXT) {
  document.getElementById('resultText').textContent = CONFIG.RESULT_TEXT;
  document.getElementById('resultText2').textContent = CONFIG.RESULT_TEXT;
} else {
  document.getElementById('resultLine').style.display = 'none';
  document.getElementById('doneResultLine').textContent = '診断結果をお届けしますので、';
}
document.getElementById('troubleText').textContent = CONFIG.TROUBLE_TEXT;

function $(id) { return document.getElementById(id); }

function setStatus(msg, isError) {
  var el = $('status');
  el.textContent = msg;
  el.className = isError ? 'error' : '';
}

// GASのAPI呼び出し（text/plainで送るとプリフライト無しで届く）
function api(payload) {
  payload.key = CONFIG.FORM_KEY;
  return fetch(CONFIG.GAS_URL, {
    method: 'POST',
    body: JSON.stringify(payload)
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (!j.ok) throw new Error(j.error || 'サーバーエラー');
    return j;
  });
}

// 1チャンクをアップロード（308=続きあり、200/201=完了）
function putChunk(uploadUrl, blob, start, total, onProgress) {
  return new Promise(function (resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open('PUT', uploadUrl, true);
    var end = start + blob.size - 1;
    xhr.setRequestHeader('Content-Range', 'bytes ' + start + '-' + end + '/' + total);
    xhr.upload.onprogress = function (ev) {
      if (ev.lengthComputable) onProgress(start + ev.loaded);
    };
    xhr.onload = function () {
      if (xhr.status === 308 || xhr.status === 200 || xhr.status === 201) resolve(xhr.status);
      else reject(new Error('アップロード失敗 (HTTP ' + xhr.status + ')'));
    };
    xhr.onerror = function () { reject(new Error('通信エラー')); };
    xhr.send(blob);
  });
}

// ファイル全体を分割アップロード（チャンクごとに3回まで再試行）
async function uploadFile(folderId, file, saveName, barId, labelId) {
  var res = await api({
    action: 'initUpload',
    folderId: folderId,
    fileName: saveName,
    mimeType: file.type || 'application/octet-stream'
  });
  var url = res.uploadUrl;

  var bar = $(barId); bar.style.display = 'block';
  var inner = bar.querySelector('.progress-inner');
  var label = $(labelId);

  function show(sent) {
    var pct = Math.min(100, Math.round(sent / file.size * 100));
    inner.style.width = pct + '%';
    label.textContent = 'アップロード中… ' + pct + '%';
  }

  var pos = 0;
  while (pos < file.size) {
    var blob = file.slice(pos, Math.min(pos + CHUNK, file.size));
    var tries = 0;
    for (;;) {
      try {
        await putChunk(url, blob, pos, file.size, show);
        break;
      } catch (e) {
        tries++;
        if (tries >= 3) throw e;
        await new Promise(function (r) { setTimeout(r, 2000 * tries); });
      }
    }
    pos += blob.size;
  }
  inner.style.width = '100%';
  label.textContent = 'アップロード完了 ✓';
}

function ext(file, fallback) {
  var m = /\.([A-Za-z0-9]+)$/.exec(file.name || '');
  return m ? m[1].toLowerCase() : fallback;
}

// 写真6枚の定義（保存名は診断時に見分けやすい連番つき）
var PHOTOS = [
  { id: 'f_p1', label: '足の正面の写真', save: '01_足正面' },
  { id: 'f_p2', label: '側面（親指側）の写真', save: '02_側面_親指側' },
  { id: 'f_p3', label: '側面（小指側）の写真', save: '03_側面_小指側' },
  { id: 'f_p4', label: '足首（後ろ）の写真', save: '04_足首_後ろ' },
  { id: 'f_p5', label: '足裏の写真', save: '05_足裏' },
  { id: 'f_p6', label: '足上の写真', save: '06_足上' }
];

function collectAndValidate() {
  var fields = [
    { id: 'f_name', label: 'お名前' },
    { id: 'f_email', label: 'メールアドレス' }
  ].concat(PHOTOS.map(function (p) { return { id: p.id, label: p.label, file: true }; }));

  var missing = [];
  fields.forEach(function (f) {
    var el = $(f.id);
    var empty = f.file ? !el.files.length : !el.value.trim();
    el.classList.toggle('err-field', empty);
    if (empty) missing.push(f.label);
  });
  if (missing.length) {
    setStatus('未入力の項目があります：\n' + missing.join(' / '), true);
    return null;
  }
  var email = $('f_email').value.trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
    $('f_email').classList.add('err-field');
    setStatus('メールアドレスの形式が正しくありません', true);
    return null;
  }
  return {
    name: $('f_name').value.trim(),
    email: email
  };
}

$('submitBtn').addEventListener('click', async function () {
  var d = collectAndValidate();
  if (!d) return;

  var btn = $('submitBtn');
  btn.disabled = true;
  setStatus('送信を開始しています…\n※完了するまでこの画面を閉じないでください');

  try {
    var s = await api({ action: 'start', name: d.name, email: d.email });
    var folderId = s.folderId;

    for (var i = 0; i < PHOTOS.length; i++) {
      var p = PHOTOS[i];
      var file = $(p.id).files[0];
      setStatus(p.label + 'をアップロード中…（' + (i + 1) + '/6）\n※完了するまでこの画面を閉じないでください');
      await uploadFile(folderId, file, p.save + '.' + ext(file, 'jpg'),
        'p_' + p.id.slice(2), 'pl_' + p.id.slice(2));
    }

    setStatus('回答を保存しています…');
    await api({
      action: 'finalize',
      folderId: folderId,
      answers: { name: d.name, email: d.email }
    });

    $('mainForm').style.display = 'none';
    $('doneCard').style.display = 'block';
    setStatus('');
    window.scrollTo(0, 0);
  } catch (e) {
    btn.disabled = false;
    setStatus('送信に失敗しました：' + e.message +
      '\n電波の良い場所でもう一度お試しください。\n何度も失敗する場合は公式LINEにご連絡ください。', true);
  }
});
</script>
</body>
</html>
